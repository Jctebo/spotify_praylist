services:
  playlist-refresh:
    build: .
    image: ${SPOTIFY_PRAYLIST_IMAGE:-spotify-praylist:local}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./artifacts/container:/data
    command: ["python", "-m", "jobs.playlist.refresh_playlist"]

  tests:
    image: ${SPOTIFY_PRAYLIST_IMAGE:-spotify-praylist:local}
    build: .
    profiles: ["test"]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"]
