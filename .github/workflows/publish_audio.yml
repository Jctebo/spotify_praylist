name: Publish Prayer Audio

on:
  workflow_dispatch:
    inputs:
      novena_publish_mode:
        description: Publish mode; daily publishes tomorrow only, bootstrap seeds today and tomorrow once, bootstrap-no-cache does the same but rebuilds audio without cache, and reset seeds today and tomorrow and truncates the novena feed. Manual runs default to daily.
        required: false
        type: choice
        options:
          - daily
          - bootstrap
          - bootstrap-no-cache
          - reset
        default: daily
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-audio:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PUBLISH_DATABASE_ID: ${{ secrets.NOTION_PUBLISH_DATABASE_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PUBLISH_AUDIO_FORCE_REBUILD: ${{ github.event.inputs.novena_publish_mode == 'bootstrap-no-cache' }}
      OAI_API_BASE_URL: https://api.openai.com/v1
      PUBLISH_MODE: ${{ github.event.inputs.novena_publish_mode }}
      NOVENA_PUBLISH_MODE: ${{ github.event.inputs.novena_publish_mode }}
      PUBLISH_GITHUB_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      PUBLISH_PODCAST_FEED_URL: https://jctebo.github.io/spotify_praylist/podcast.xml
      AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore publish audio cache
        id: publish_audio_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/publish_audio/fragments
            .cache/publish_audio/silence
          key: publish-audio-${{ runner.os }}-py311-fragments-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            publish-audio-${{ runner.os }}-py311-fragments-v1-

      - name: Restore published audio archive
        id: published_audio_archive_restore
        uses: actions/cache/restore@v4
        with:
          path: docs/audio
          key: publish-audio-archive-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            publish-audio-archive-${{ runner.os }}-v1-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish audio files and RSS feed
        run: python -m jobs.publish.run_audio_pipeline

      - name: Publish novena audio and RSS feed
        run: python -m jobs.novena_contracts.pipeline

      - name: Install rclone
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Missing secret RCLONE_CONFIG_B64" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf "%s" "${RCLONE_CONFIG_B64}" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"

      - name: Restore devotional image public tree
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"
          LOCAL_ROOT="${GITHUB_WORKSPACE}/onedrive_sync/DCIM"

          mkdir -p \
            "${LOCAL_ROOT}/Current Devotion" \
            "${LOCAL_ROOT}/Current Devotion Wide"

          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion/" "${LOCAL_ROOT}/Current Devotion/" --create-empty-src-dirs
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion Wide/" "${LOCAL_ROOT}/Current Devotion Wide/" --create-empty-src-dirs
          rclone copyto "${REMOTE_NAME}:${REMOTE_ROOT}/devotional_image_library.json" "${LOCAL_ROOT}/devotional_image_library.json"

          python sync/build_devotional_public_tree.py \
            --source-root "${LOCAL_ROOT}" \
            --target-root "${GITHUB_WORKSPACE}/docs/devotional/DCIM"

      - name: Build prayer website
        run: python -m jobs.publish.site

      - name: Sync audio archive to R2
        run: python scripts/sync_r2_audio.py

      - name: Save publish audio cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/publish_audio/fragments
            .cache/publish_audio/silence
          key: publish-audio-${{ runner.os }}-py311-fragments-v1-${{ github.run_id }}-${{ hashFiles('requirements.txt') }}

      - name: Save published audio archive
        if: success()
        uses: actions/cache/save@v4
        with:
          path: docs/audio
          key: publish-audio-archive-${{ runner.os }}-v1-${{ github.run_id }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf pages_artifact
          mkdir -p pages_artifact
          cp -a docs/. pages_artifact/
          rm -rf pages_artifact/audio

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/pages_artifact

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deploy-pages
        uses: actions/deploy-pages@v4
