name: Publish Prayer Audio

on:
  workflow_dispatch:
    inputs:
      novena_publish_mode:
        description: Publish mode; daily publishes tomorrow only, bootstrap seeds today and tomorrow once, bootstrap-no-cache does the same but rebuilds audio without cache, and reset seeds today and tomorrow and truncates the novena feed. Manual runs default to daily.
        required: false
        type: choice
        options:
          - daily
          - bootstrap
          - bootstrap-no-cache
          - reset
        default: daily
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: podcast-pages-publish
  cancel-in-progress: false

jobs:
  publish-audio:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PUBLISH_AUDIO_FORCE_REBUILD: ${{ github.event.inputs.novena_publish_mode == 'bootstrap-no-cache' }}
      OAI_API_BASE_URL: https://api.openai.com/v1
      PUBLISH_MODE: ${{ github.event.inputs.novena_publish_mode }}
      NOVENA_PUBLISH_MODE: ${{ github.event.inputs.novena_publish_mode }}
      PUBLISH_GITHUB_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      PUBLISH_PODCAST_FEED_URL: https://jctebo.github.io/spotify_praylist/podcast.xml
      AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore publish audio cache
        id: publish_audio_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/publish_audio/fragments
            .cache/publish_audio/silence
          key: publish-audio-${{ runner.os }}-py311-fragments-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            publish-audio-${{ runner.os }}-py311-fragments-v1-

      - name: Restore published audio archive
        id: published_audio_archive_restore
        uses: actions/cache/restore@v4
        with:
          path: docs/audio
          key: publish-audio-archive-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            publish-audio-archive-${{ runner.os }}-v1-

      - name: Restore local publish state
        uses: actions/cache/restore@v4
        with:
          path: .cache/publish_state
          key: publish-state-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            publish-state-${{ runner.os }}-v1-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish audio files and RSS feed
        run: python -m jobs.publish.run_audio_pipeline

      - name: Publish novena audio and RSS feed
        run: python -m jobs.novena_contracts.pipeline

      - name: Sync audio archive to R2
        run: python scripts/sync_r2_audio.py

      - name: Save publish audio cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/publish_audio/fragments
            .cache/publish_audio/silence
          key: publish-audio-${{ runner.os }}-py311-fragments-v1-${{ github.run_id }}-${{ hashFiles('requirements.txt') }}

      - name: Save published audio archive
        if: success()
        uses: actions/cache/save@v4
        with:
          path: docs/audio
          key: publish-audio-archive-${{ runner.os }}-v1-${{ github.run_id }}

      - name: Save local publish state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .cache/publish_state
          key: publish-state-${{ runner.os }}-v1-${{ github.run_id }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf pages_artifact

      - name: Stage today's devotional wallpaper when available
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "No wallpaper remote configured; the site will use its image fallback."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf "%s" "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          today="$(TZ=America/Chicago date +%F)"
          remote="$RCLONE_REMOTE_NAME:$RCLONE_REMOTE_ROOT/phone-current"
          matches="$(rclone lsf --files-only "$remote" 2>/dev/null | grep -E "__${today}\\.(jpg|jpeg|png|webp)$" || true)"
          if [ -z "$matches" ]; then
            echo "No phone wallpaper found for $today; the site will use its image fallback."
            exit 0
          fi
          filename="$(printf '%s\n' "$matches" | LC_ALL=C sort | head -n 1)"
          extension="${filename##*.}"
          mkdir -p pages_artifact/images
          temporary="pages_artifact/images/daily-wallpaper.$extension.tmp"
          trap 'rm -f "$temporary"' EXIT
          rclone copyto "$remote/$filename" "$temporary"
          mv "$temporary" "pages_artifact/images/daily-wallpaper.$extension"

      - name: Build GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          wallpaper="$(find pages_artifact/images -maxdepth 1 -type f -name 'daily-wallpaper.*' -print -quit 2>/dev/null || true)"
          if [ -n "$wallpaper" ]; then
            python scripts/build_pages_artifact.py --wallpaper "$wallpaper"
          else
            python scripts/build_pages_artifact.py
          fi

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/pages_artifact

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deploy-pages
        uses: actions/deploy-pages@v4
