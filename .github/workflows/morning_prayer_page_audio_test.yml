name: Website Publish Validation

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run website publish validation tests
        run: python -m unittest tests.test_page_audio_job tests.test_publish_site tests.test_spotify_contracts tests.test_publish_contracts
