name: Hourly Notion Completion Sync

on:
  workflow_dispatch:
  schedule:
    # Hourly except 11:00 PM-3:59 AM for default CST offset (-06:00).
    # Script also enforces quiet-hours using JOB_UTC_OFFSET/config utc_offset.
    - cron: "5 0-4,10-23 * * *"

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync completed prayers to Notion
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          JOB_UTC_OFFSET: ${{ vars.JOB_UTC_OFFSET }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_NAME: ${{ vars.NOTION_DATABASE_NAME }}
          NOTION_TITLE_PROPERTY: ${{ vars.NOTION_TITLE_PROPERTY }}
          NOTION_COMPLETED_PROPERTY: ${{ vars.NOTION_COMPLETED_PROPERTY }}
          NOTION_PLATFORM_PROPERTY: ${{ vars.NOTION_PLATFORM_PROPERTY }}
          NOTION_PLATFORM_NOSYNC_VALUE: ${{ vars.NOTION_PLATFORM_NOSYNC_VALUE }}
          NOTION_URI_PROPERTY: ${{ vars.NOTION_URI_PROPERTY }}
          SPOTIFY_NOTION_SYNC_CONFIG: config/notion_spotify_sync_config.json
          SPOTIFY_CONFIG_FILE: config/playlist_config.json
          SPOTIFY_RECENT_LOOKBACK_HOURS: ${{ vars.SPOTIFY_RECENT_LOOKBACK_HOURS }}
          SPOTIFY_RECENT_WINDOW_MODE: today
        run: python jobs/notion/sync_notion_completions.py
