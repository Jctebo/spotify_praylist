name: Daily Devotional Image (Remote OneDrive via rclone)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *" # daily 03:15 CST / 04:15 CDT

permissions:
  contents: read

jobs:
  devotional-image-remote:
    runs-on: ubuntu-latest

    env:
      OAI_API_BASE_URL: https://api.openai.com/v1
      ROMCAL_CALENDAR: general_roman
      ROMCAL_LOCALE: en
      ROMCAL_WINDOW_DAYS: "9"
      DEVOTIONAL_NOTION_CONFIG_ENABLED: "true"
      NOTION_DATABASE_NAME: Opus Dei
      NOTION_IMAGE_STYLE_DATABASE_NAME: Image Styles
      NOTION_DEVOTIONS_DATABASE_NAME: Devotions
      NOTION_IMAGE_PIPELINE_DATABASE_NAME: Image Pipeline
      DEVOTIONAL_PROMPT_MODEL: gpt-5-mini
      DEVOTIONAL_IMAGE_MODEL: gpt-image-1
      DEVOTIONAL_IMAGE_SIZE: 1024x1536
      DEVOTIONAL_IMAGE_SIZE_WIDE: 1536x1024
      DEVOTIONAL_IMAGE_QUALITY: high
      DEVOTIONAL_IMAGE_FORMAT: png
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Missing secret RCLONE_CONFIG_B64" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf "%s" "${RCLONE_CONFIG_B64}" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"

      - name: Validate rclone remote
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"
          rclone lsd "${REMOTE_NAME}:" >/dev/null
          rclone lsd "${REMOTE_NAME}:${REMOTE_ROOT}" >/dev/null || true

      - name: Prefetch existing devotional files from OneDrive
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"
          LOCAL_ROOT="${GITHUB_WORKSPACE}/onedrive_sync/DCIM"

          mkdir -p "${LOCAL_ROOT}/Current Devotion" "${LOCAL_ROOT}/Devotion Wide"

          # Pull active folders so skip_existing works on ephemeral runners.
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion/" "${LOCAL_ROOT}/Current Devotion/" --create-empty-src-dirs || true
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Devotion Wide/" "${LOCAL_ROOT}/Devotion Wide/" --create-empty-src-dirs || true

          # Pull only month archives that can appear in the active window.
          MONTHS=$(python -c "import datetime, os; days=int(os.getenv('ROMCAL_WINDOW_DAYS','9')); today=datetime.date.today(); offsets={-1,*range(days)}; names=sorted({(today+datetime.timedelta(days=i)).strftime('%B') for i in offsets}); print('\n'.join(names))")
          while IFS= read -r month; do
            [ -z "$month" ] && continue
            rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/${month} Devotion/" "${LOCAL_ROOT}/${month} Devotion/" --create-empty-src-dirs || true
            rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/${month} Devotion Wide/" "${LOCAL_ROOT}/${month} Devotion Wide/" --create-empty-src-dirs || true
          done <<< "${MONTHS}"

      - name: Generate devotional image locally on runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DEVOTIONAL_ONEDRIVE_DCIM_DIR: ${{ github.workspace }}/onedrive_sync/DCIM
        run: python jobs/novena/generate_devotional_image.py

      - name: Upload files to OneDrive with rclone
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/Current Devotion"
          WIDE_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/Devotion Wide"
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"

          if ! find "$CURRENT_DIR" -maxdepth 1 -type f | grep -q .; then
            echo "No files found in ${CURRENT_DIR}" >&2
            exit 1
          fi
          if ! find "$WIDE_DIR" -maxdepth 1 -type f | grep -q .; then
            echo "No files found in ${WIDE_DIR}" >&2
            exit 1
          fi

          # Mirror current folders to remote (overwrite + remove stale files).
          rclone sync "$CURRENT_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion/" --progress --transfers 4 --checkers 8
          rclone sync "$WIDE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Devotion Wide/" --progress --transfers 4 --checkers 8

          # Mirror relevant month archive folders so local move operations are reflected remotely.
          MONTHS=$(python -c "import datetime, os; days=int(os.getenv('ROMCAL_WINDOW_DAYS','9')); today=datetime.date.today(); offsets={-1,*range(days)}; names=sorted({(today+datetime.timedelta(days=i)).strftime('%B') for i in offsets}); print('\n'.join(names))")
          while IFS= read -r month; do
            [ -z "$month" ] && continue
            LOCAL_MONTH_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/${month} Devotion"
            LOCAL_MONTH_WIDE_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/${month} Devotion Wide"
            mkdir -p "$LOCAL_MONTH_DIR" "$LOCAL_MONTH_WIDE_DIR"
            rclone sync "$LOCAL_MONTH_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/${month} Devotion/" --progress --transfers 4 --checkers 8
            rclone sync "$LOCAL_MONTH_WIDE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/${month} Devotion Wide/" --progress --transfers 4 --checkers 8
          done <<< "${MONTHS}"

          echo "Synced devotional files to OneDrive via rclone."
