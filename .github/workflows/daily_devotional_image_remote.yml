name: Daily Devotional Image (Remote OneDrive via rclone)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *" # daily 02:15 CST / 03:15 CDT

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  calendar:
    runs-on: ubuntu-latest

    env:
      OAI_API_BASE_URL: https://api.openai.com/v1
      ROMCAL_CALENDAR: general_roman
      ROMCAL_LOCALE: en
      ROMCAL_WINDOW_DAYS: "9"
      DEVOTIONAL_NOTION_CONFIG_ENABLED: "true"
      NOTION_DATABASE_NAME: Opus Dei
      NOTION_IMAGE_CONFIG_PARENT_PAGE_ID: ${{ vars.NOTION_IMAGE_CONFIG_PARENT_PAGE_ID }}
      NOTION_IMAGE_STYLE_DATABASE_NAME: Image Styles
      NOTION_DEVOTIONS_DATABASE_NAME: Devotions
      NOTION_IMAGE_PIPELINE_DATABASE_NAME: Image Pipeline
      DEVOTIONAL_PROMPT_MODEL: gpt-5-mini
      DEVOTIONAL_IMAGE_MODEL: gpt-image-1
      DEVOTIONAL_IMAGE_SIZE: 1024x1536
      DEVOTIONAL_IMAGE_SIZE_WIDE: 1536x1024
      DEVOTIONAL_IMAGE_QUALITY: high
      DEVOTIONAL_IMAGE_FORMAT: png
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Missing secret RCLONE_CONFIG_B64" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf "%s" "${RCLONE_CONFIG_B64}" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"

      - name: Validate rclone remote
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"
          rclone lsd "${REMOTE_NAME}:" >/dev/null
          rclone lsd "${REMOTE_NAME}:${REMOTE_ROOT}" >/dev/null || true

      - name: Prefetch existing devotional files from OneDrive
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"
          LOCAL_ROOT="${GITHUB_WORKSPACE}/onedrive_sync/DCIM"

          mkdir -p \
            "${LOCAL_ROOT}/Current Devotion" \
            "${LOCAL_ROOT}/Non Current Devotion" \
            "${LOCAL_ROOT}/Current Devotion Wide" \
            "${LOCAL_ROOT}/Non Current Devotion Wide" \
            "${LOCAL_ROOT}/Devotional Metadata Archive"

          # Pull canonical folders so skip_existing and archive restore work on ephemeral runners.
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion/" "${LOCAL_ROOT}/Current Devotion/" --create-empty-src-dirs || true
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Non Current Devotion/" "${LOCAL_ROOT}/Non Current Devotion/" --create-empty-src-dirs || true
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion Wide/" "${LOCAL_ROOT}/Current Devotion Wide/" --create-empty-src-dirs || true
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Non Current Devotion Wide/" "${LOCAL_ROOT}/Non Current Devotion Wide/" --create-empty-src-dirs || true
          rclone copy "${REMOTE_NAME}:${REMOTE_ROOT}/Devotional Metadata Archive/" "${LOCAL_ROOT}/Devotional Metadata Archive/" --create-empty-src-dirs || true
          rclone copyto "${REMOTE_NAME}:${REMOTE_ROOT}/devotional_image_library.json" "${LOCAL_ROOT}/devotional_image_library.json" || true

      - name: Generate devotional image locally on runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DEVOTIONAL_ONEDRIVE_DCIM_DIR: ${{ github.workspace }}/onedrive_sync/DCIM
        run: python jobs/novena/generate_devotional_image.py

      - name: Generate daily novena locally on runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_NAME: ${{ vars.NOTION_DATABASE_NAME }}
          NOTION_WRITE_DAILY_NOVENA_PAGE: "true"
          NOVENA_AUDIO_ENABLED: "false"
          ROMCAL_CALENDAR: general_roman
          ROMCAL_LOCALE: en
          ROMCAL_WINDOW_DAYS: "9"
        run: python jobs/novena/generate_daily_novena_prayer.py

      - name: Upload files to OneDrive with rclone
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_ROOT="${GITHUB_WORKSPACE}/onedrive_sync/DCIM"
          CURRENT_DIR="${LOCAL_ROOT}/Current Devotion"
          ARCHIVE_DIR="${LOCAL_ROOT}/Non Current Devotion"
          CURRENT_WIDE_DIR="${LOCAL_ROOT}/Current Devotion Wide"
          ARCHIVE_WIDE_DIR="${LOCAL_ROOT}/Non Current Devotion Wide"
          METADATA_ARCHIVE_DIR="${LOCAL_ROOT}/Devotional Metadata Archive"
          ROOT_MANIFEST="${LOCAL_ROOT}/devotional_image_library.json"
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"

          mkdir -p "$CURRENT_DIR" "$ARCHIVE_DIR" "$CURRENT_WIDE_DIR" "$ARCHIVE_WIDE_DIR"
          mkdir -p "$METADATA_ARCHIVE_DIR"

          # Mirror canonical folders to remote (overwrite + remove stale files).
          rclone sync "$CURRENT_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion/" --progress --transfers 4 --checkers 8
          rclone sync "$ARCHIVE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Non Current Devotion/" --progress --transfers 4 --checkers 8
          rclone sync "$CURRENT_WIDE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Current Devotion Wide/" --progress --transfers 4 --checkers 8
          rclone sync "$ARCHIVE_WIDE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Non Current Devotion Wide/" --progress --transfers 4 --checkers 8
          rclone sync "$METADATA_ARCHIVE_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/Devotional Metadata Archive/" --progress --transfers 4 --checkers 8
          if [ -f "$ROOT_MANIFEST" ]; then
            rclone copyto "$ROOT_MANIFEST" "${REMOTE_NAME}:${REMOTE_ROOT}/devotional_image_library.json" --progress
          fi

          echo "Synced devotional files and manifests to OneDrive via rclone."

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python sync/build_devotional_public_tree.py \
            --source-root "${GITHUB_WORKSPACE}/onedrive_sync/DCIM" \
            --target-root "${GITHUB_WORKSPACE}/pages/devotional/DCIM"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/pages

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deploy-pages
        uses: actions/deploy-pages@v4

  matrix:
    needs: calendar
    runs-on: ubuntu-latest
    env:
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - page_audio_config_file: config/afternoon_prayer_page_audio.json
          - page_audio_config_file: config/angelus_evening_page_audio.json
          - page_audio_config_file: config/angelus_midday_page_audio.json
          - page_audio_config_file: config/angelus_morning_page_audio.json
          - page_audio_config_file: config/auxilium_daily_text.json
          - page_audio_config_file: config/bible_in_a_year_page_audio.json
          - page_audio_config_file: config/daily_examen_page_audio.json
          - page_audio_config_file: config/daily_mass_readings_page_audio.json
          - page_audio_config_file: config/divine_office_invitatory_page_audio.json
          - page_audio_config_file: config/divine_office_night_page_audio.json
          - page_audio_config_file: config/morning-prayer.json
          - page_audio_config_file: config/rosary.json
          - page_audio_config_file: config/saint_of_the_day_page_audio.json
          - page_audio_config_file: config/sing_the_hours_evening_page_audio.json
          - page_audio_config_file: config/sing_the_hours_morning_page_audio.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Missing secret RCLONE_CONFIG_B64" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf "%s" "${RCLONE_CONFIG_B64}" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"

      - name: Generate page audio from contract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PAGE_AUDIO_CONFIG_FILE: ${{ matrix.page_audio_config_file }}
          PAGE_AUDIO_CACHE_DIR: .cache/page_audio
          PAGE_AUDIO_LIBRARY_DIR: ${{ github.workspace }}/page_audio_library
          PAGE_AUDIO_FAIL_OPEN: "false"
          OAI_API_BASE_URL: https://api.openai.com/v1
          JOB_UTC_OFFSET: -06:00
        run: python jobs/notion/generate_page_audio.py

      - name: Upload page audio library artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-audio-library-${{ strategy.job-index }}
          path: ${{ github.workspace }}/page_audio_library
          if-no-files-found: error

  sync_page_audio_library:
    needs: matrix
    runs-on: ubuntu-latest
    env:
      RCLONE_REMOTE_NAME: ${{ vars.RCLONE_REMOTE_NAME }}
      RCLONE_REMOTE_ROOT: ${{ vars.RCLONE_REMOTE_ROOT }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "Missing secret RCLONE_CONFIG_B64" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf "%s" "${RCLONE_CONFIG_B64}" | base64 -d > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"

      - name: Download page audio library artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: page-audio-library-*
          path: ${{ github.workspace }}/page_audio_library_merged
          merge-multiple: true

      - name: Sync page audio library to OneDrive
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_LIBRARY_DIR="${GITHUB_WORKSPACE}/page_audio_library_merged"
          REMOTE_NAME="${RCLONE_REMOTE_NAME:-onedrive}"
          REMOTE_ROOT="${RCLONE_REMOTE_ROOT:-Pictures/Samsung Gallery/DCIM}"

          if [ -d "$LOCAL_LIBRARY_DIR" ]; then
            rclone sync "$LOCAL_LIBRARY_DIR/" "${REMOTE_NAME}:${REMOTE_ROOT}/" --progress --transfers 4 --checkers 8
          else
            echo "No page audio library directory found at ${LOCAL_LIBRARY_DIR}; skipping OneDrive sync."
          fi

          echo "Synced page audio library to OneDrive via rclone."
