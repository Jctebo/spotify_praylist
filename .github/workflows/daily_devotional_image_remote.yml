name: Daily Devotional Image (Remote OneDrive)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *" # daily 03:15 CST / 04:15 CDT

permissions:
  id-token: write
  contents: read

jobs:
  devotional-image-remote:
    runs-on: ubuntu-latest

    env:
      OAI_API_BASE_URL: https://api.openai.com/v1
      ROMCAL_CALENDAR: general_roman
      ROMCAL_LOCALE: en
      ROMCAL_WINDOW_DAYS: "9"
      DEVOTIONAL_PROMPT_MODEL: gpt-5-mini
      DEVOTIONAL_IMAGE_MODEL: gpt-image-1
      DEVOTIONAL_IMAGE_SIZE: 1024x1024
      DEVOTIONAL_IMAGE_QUALITY: high
      DEVOTIONAL_IMAGE_FORMAT: png

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate devotional image locally on runner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEVOTIONAL_ONEDRIVE_DCIM_DIR: ${{ github.workspace }}/onedrive_sync/DCIM
        run: python jobs/novena/generate_devotional_image.py

      - name: Upload files to OneDrive Current Devotion + Devotion Wide
        shell: bash
        env:
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
        run: |
          set -euo pipefail

          CURRENT_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/Current Devotion"
          WIDE_DIR="${GITHUB_WORKSPACE}/onedrive_sync/DCIM/Devotion Wide"

          IMAGE_FILE="$(find "$CURRENT_DIR" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpeg' -o -name '*.webp' \) | head -n 1)"
          if [ -z "${IMAGE_FILE}" ]; then
            echo "No image file found in ${CURRENT_DIR}" >&2
            exit 1
          fi
          PROMPT_FILE="${IMAGE_FILE%.*}.prompt.txt"
          if [ ! -f "${PROMPT_FILE}" ]; then
            echo "Prompt file not found: ${PROMPT_FILE}" >&2
            exit 1
          fi

          ACCESS_TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "Failed to obtain Microsoft Graph access token." >&2
            exit 1
          fi

          upload_file() {
            local local_path="$1"
            local remote_path="$2"
            local encoded_path
            encoded_path="$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe='/'))" "${remote_path}")"
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${local_path}" \
              "https://graph.microsoft.com/v1.0/users/${ONEDRIVE_USER_ID}/drive/root:/${encoded_path}:/content" >/dev/null
          }

          IMAGE_NAME="$(basename "${IMAGE_FILE}")"
          PROMPT_NAME="$(basename "${PROMPT_FILE}")"
          WIDE_IMAGE_FILE="${WIDE_DIR}/${IMAGE_NAME}"

          if [ ! -f "${WIDE_IMAGE_FILE}" ]; then
            echo "Expected wide image file not found: ${WIDE_IMAGE_FILE}" >&2
            exit 1
          fi

          upload_file "${IMAGE_FILE}" "Pictures/Samsung Gallery/DCIM/Current Devotion/${IMAGE_NAME}"
          upload_file "${PROMPT_FILE}" "Pictures/Samsung Gallery/DCIM/Current Devotion/${PROMPT_NAME}"
          upload_file "${WIDE_IMAGE_FILE}" "Pictures/Samsung Gallery/DCIM/Devotion Wide/${IMAGE_NAME}"

          echo "Uploaded image + prompt files to OneDrive."
