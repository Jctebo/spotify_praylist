name: Daily Spotify Playlist Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8 * * *" # daily 02:05 CST / 03:05 CDT

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_NAME: ${{ vars.SPOTIFY_PLAYLIST_NAME }}
          JOB_UTC_OFFSET: ${{ vars.JOB_UTC_OFFSET }}
          SPOTIFY_REFRESH_CONFIG_SOURCE: notion
          SPOTIFY_ENABLE_URI_AUTOSYNC: "false"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_NAME: ${{ vars.NOTION_DATABASE_NAME }}
          NOTION_PLAYLISTS_DATABASE_ID: ${{ vars.NOTION_PLAYLISTS_DATABASE_ID || secrets.NOTION_PLAYLISTS_DATABASE_ID }}
          NOTION_PLAYLISTS_DATABASE_NAME: ${{ vars.NOTION_PLAYLISTS_DATABASE_NAME }}
          NOTION_TITLE_PROPERTY: ${{ vars.NOTION_TITLE_PROPERTY }}
          NOTION_PLATFORM_PROPERTY: ${{ vars.NOTION_PLATFORM_PROPERTY }}
          NOTION_PLATFORM_SPOTIFY_VALUE: ${{ vars.NOTION_PLATFORM_SPOTIFY_VALUE }}
          NOTION_PLATFORM_NOSYNC_VALUE: ${{ vars.NOTION_PLATFORM_NOSYNC_VALUE }}
          NOTION_PLAYLISTS_TITLE_PROPERTY: ${{ vars.NOTION_PLAYLISTS_TITLE_PROPERTY }}
          NOTION_PLAYLISTS_ID_PROPERTY: ${{ vars.NOTION_PLAYLISTS_ID_PROPERTY }}
          NOTION_PLAYLISTS_ENABLED_PROPERTY: ${{ vars.NOTION_PLAYLISTS_ENABLED_PROPERTY }}
          NOTION_QUEUE_PLAYLIST_PROPERTY: ${{ vars.NOTION_QUEUE_PLAYLIST_PROPERTY }}
          NOTION_QUEUE_PROFILE_PROPERTY: ${{ vars.NOTION_QUEUE_PROFILE_PROPERTY }}
          NOTION_QUEUE_ORDER_PROPERTY: ${{ vars.NOTION_QUEUE_ORDER_PROPERTY }}
          NOTION_QUEUE_RESOLVER_PROPERTY: ${{ vars.NOTION_QUEUE_RESOLVER_PROPERTY }}
          NOTION_QUEUE_FALLBACK_PROPERTY: ${{ vars.NOTION_QUEUE_FALLBACK_PROPERTY }}
          NOTION_QUEUE_ENABLED_PROPERTY: ${{ vars.NOTION_QUEUE_ENABLED_PROPERTY }}
          NOTION_URI_PROPERTY: ${{ vars.NOTION_URI_PROPERTY }}
          NOTION_SPOTIFY_BOOKMARKS_ENABLED: ${{ vars.NOTION_SPOTIFY_BOOKMARKS_ENABLED || vars.NOTION_SPOTIFY_EMBEDS_ENABLED }}
          NOTION_INTENTIONS_ENABLED: ${{ vars.NOTION_INTENTIONS_ENABLED }}
          NOTION_INTENTIONS_RUN_PLAYLIST: ${{ vars.NOTION_INTENTIONS_RUN_PLAYLIST }}
          NOTION_INTENTIONS_RUN_PROFILE: ${{ vars.NOTION_INTENTIONS_RUN_PROFILE }}
          NOTION_INTENTION_PROPERTY: ${{ vars.NOTION_INTENTION_PROPERTY }}
          NOTION_INTENTIONS_DATABASE_ID: ${{ vars.NOTION_INTENTIONS_DATABASE_ID || secrets.NOTION_INTENTIONS_DATABASE_ID }}
          NOTION_INTENTIONS_DATABASE_NAME: ${{ vars.NOTION_INTENTIONS_DATABASE_NAME }}
          NOTION_INTENTIONS_PETITION_PROPERTY: ${{ vars.NOTION_INTENTIONS_PETITION_PROPERTY }}
          NOTION_INTENTIONS_STATUS_PROPERTY: ${{ vars.NOTION_INTENTIONS_STATUS_PROPERTY }}
          NOTION_INTENTIONS_FREQUENCY_PROPERTY: ${{ vars.NOTION_INTENTIONS_FREQUENCY_PROPERTY }}
          NOTION_INTENTIONS_STATUS_ALLOWED: ${{ vars.NOTION_INTENTIONS_STATUS_ALLOWED }}
        run: python jobs/playlist/refresh_playlist.py
