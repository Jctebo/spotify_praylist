name: Daily Spotify Playlist Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # daily 03:00 CST / 04:00 CDT

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read run matrix from config
        id: cfg
        run: echo "matrix=$(jq -c '.runs' playlist_config.json)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: load-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-config.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CONFIG_FILE: playlist_config.json
          SPOTIFY_PLAYLIST_PROFILE: ${{ matrix.profile }}
          SPOTIFY_PLAYLIST_ID: ${{ matrix.playlist_id }}
        run: python refresh_playlist.py
