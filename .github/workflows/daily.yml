name: Daily Spotify Playlist Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # daily 03:00 CST / 04:00 CDT

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CONFIG_FILE: playlist_config.json
          SPOTIFY_NOTION_SYNC_CONFIG: notion_spotify_sync_config.json
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_NAME: ${{ vars.NOTION_DATABASE_NAME }}
          NOTION_TITLE_PROPERTY: ${{ vars.NOTION_TITLE_PROPERTY }}
          NOTION_PLATFORM_PROPERTY: ${{ vars.NOTION_PLATFORM_PROPERTY }}
          NOTION_PLATFORM_SPOTIFY_VALUE: ${{ vars.NOTION_PLATFORM_SPOTIFY_VALUE }}
          NOTION_URI_PROPERTY: ${{ vars.NOTION_URI_PROPERTY }}
        run: |
          set -euo pipefail
          jq -c '.profiles | to_entries[] | select(.value.playlist_id != null and .value.playlist_id != "") | {profile:.key, playlist_id:.value.playlist_id}' playlist_config.json \
          | while read -r row; do
              profile="$(echo "$row" | jq -r '.profile')"
              playlist_id="$(echo "$row" | jq -r '.playlist_id')"
              echo "Running profile=${profile} playlist_id=${playlist_id}"
              SPOTIFY_PLAYLIST_PROFILE="$profile" SPOTIFY_PLAYLIST_ID="$playlist_id" python refresh_playlist.py
            done
