name: Daily Spotify Playlist Refresh

on:
  workflow_dispatch:
    inputs:
      spotify_playlist_name:
        description: Optional playlist definition key or display name to refresh
        required: false
        type: string
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
    - cron: "0 13 * * *" # daily 13:00 UTC
    - cron: "0 21 * * *" # daily 21:00 UTC

jobs:
  refresh:
    if: ${{ github.event_name != 'schedule' || vars.SPOTIFY_REFRESH_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Spotify playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          # Required for Notion-owned playlist membership/order; also used by optional post-write helpers.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_NAME: ${{ vars.NOTION_DATABASE_NAME }}
          JOB_UTC_OFFSET: ${{ vars.JOB_UTC_OFFSET }}
          SPOTIFY_PLAYLIST_NAME: ${{ github.event.inputs.spotify_playlist_name }}
        run: python -m jobs.playlist.refresh_playlist
