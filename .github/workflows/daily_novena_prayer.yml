name: Prayer Contracts Matrix

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  discover-contracts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build contract matrix
        id: build-matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contracts = sorted(
              str(path.as_posix())
              for path in Path("config").glob("*.json")
              if path.is_file()
          )
          if not contracts:
              raise SystemExit("No top-level config/*.json contracts found.")

          matrix = {"include": [{"page_audio_config_file": path} for path in contracts]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          PY

  generate-prayer-contracts:
    needs: discover-contracts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-contracts.outputs.matrix) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate page audio from contract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PAGE_AUDIO_CONFIG_FILE: ${{ matrix.page_audio_config_file }}
          PAGE_AUDIO_CACHE_DIR: .cache/page_audio
          PAGE_AUDIO_FAIL_OPEN: "false"
          OAI_API_BASE_URL: https://api.openai.com/v1
          JOB_UTC_OFFSET: -06:00
        run: python jobs/notion/generate_page_audio.py
